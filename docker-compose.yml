# version: '3.8'

services:
  # Database Container (MySQL)
  database:
    image: mysql:8.0
    container_name: todo_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 507507
      MYSQL_DATABASE: task_db
      MYSQL_USER: todouser
      MYSQL_PASSWORD: todopass
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p507507"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend API Container (Flask)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_backend
    restart: unless-stopped
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=507507
      - DATABASE_NAME=task_db
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Container (Nginx)
  frontend:
    image: nginx:alpine
    container_name: todo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for data persistence
volumes:
  mysql_data:
    driver: local

# Custom network for inter-container communication
networks:
  todo_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16